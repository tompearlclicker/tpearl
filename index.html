<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tom Pearl: Poop Clicker</title>
<style>
* { box-sizing: border-box; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif; margin:0; padding:0; }
body {
  background: linear-gradient(135deg, #3a2010, #6a3a1c, #3a2010);
  color: #fff;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
#ticker {
  background: rgba(0,0,0,0.5);
  padding: 5px 0;
  overflow: hidden;
  white-space: nowrap;
  font-size: 0.85em;
  border-bottom: 2px solid #ffec8b;
}
#tickerInner {
  display: inline-block;
  animation: ticker 40s linear infinite;
}
@keyframes ticker { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
#main { display: flex; flex: 1; min-height: 0; }
#left {
  flex: 1.2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 20px 15px;
  text-align: center;
  border-right: 2px solid rgba(255,255,255,0.1);
}
#right {
  flex: 1;
  background: rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 35px);
}
h1 { margin: 5px 0 3px; text-shadow: 3px 3px #000; font-size: 1.6em; }
#count { font-size: 2.6em; font-weight: bold; text-shadow: 2px 2px #000; margin: 4px 0; }
#perSec { font-size: 1em; opacity: 0.9; margin-bottom: 4px; }
#clickVal { font-size: 0.85em; opacity: 0.75; margin-bottom: 8px; }
#tomWrap { position: relative; display: inline-block; margin: 6px 0; }
#tomImg {
  width: 210px; height: 210px;
  object-fit: cover;
  border-radius: 50%;
  border: 8px solid #8a5a2c;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(255,220,50,0.3), 0 0 10px rgba(0,0,0,0.8);
  transition: transform 0.05s, box-shadow 0.2s;
  background: #3a2010;
  display: block;
}
#tomImg:active { transform: scale(0.90); }
#milestoneLabel {
  font-size: 0.8em;
  opacity: 0.7;
  margin-top: 4px;
  min-height: 1.2em;
}
.floatup {
  position: absolute;
  font-weight: bold;
  color: #ffec8b;
  pointer-events: none;
  animation: floatUp 1s forwards;
  text-shadow: 1px 1px #000;
  font-size: 1.3em;
  z-index: 10;
}
@keyframes floatUp { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-80px); } }
#goldenPoop {
  position: fixed;
  font-size: 2.2em;
  cursor: pointer;
  display: none;
  z-index: 9999;
  filter: drop-shadow(0 0 12px gold) drop-shadow(0 0 25px orange);
  user-select: none;
}
@keyframes bobble { from { transform: scale(1) rotate(-5deg); } to { transform: scale(1.15) rotate(5deg); } }
@keyframes spinCrazy { 0%{transform:rotate(0deg) scale(1);} 25%{transform:rotate(180deg) scale(1.8);} 50%{transform:rotate(360deg) scale(0.5);} 75%{transform:rotate(540deg) scale(2.2);} 100%{transform:rotate(720deg) scale(1);} }
@keyframes flashColors { 0%{filter:drop-shadow(0 0 15px gold) hue-rotate(0deg) brightness(1);} 50%{filter:drop-shadow(0 0 60px red) hue-rotate(180deg) brightness(3);} 100%{filter:drop-shadow(0 0 15px gold) hue-rotate(360deg) brightness(1);} }
@keyframes screenShake { 0%{transform:translate(0,0);} 20%{transform:translate(-6px,4px);} 40%{transform:translate(6px,-4px);} 60%{transform:translate(-4px,6px);} 80%{transform:translate(4px,-6px);} 100%{transform:translate(0,0);} }
@keyframes rainFall { from{transform:translateY(0) rotate(0deg);opacity:1;} to{transform:translateY(110vh) rotate(720deg);opacity:0;} }
#stats { font-size: 0.78em; opacity: 0.75; margin: 6px 0; line-height: 1.6; }
#prestigeArea { margin: 8px 0; }
#prestigeBtn {
  background: linear-gradient(135deg, #7b1fa2, #4a148c);
  border: 2px solid #ce93d8;
  color: #fff;
  padding: 8px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 1em;
  display: none;
}
#prestigeBtn:hover { background: linear-gradient(135deg, #9c27b0, #6a1b9a); }
#prestigeCount { font-size: 0.8em; opacity: 0.8; }
#saveBtns { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
button.ctrl {
  background: #6a3a1c;
  border: 2px solid #ffec8b;
  color: #fff;
  padding: 5px 11px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.85em;
}
button.ctrl:hover { background: #8a5a2c; }
#notice {
  position: fixed; top: 45px; right: 10px;
  background: #2e7d32; padding: 8px 16px;
  border-radius: 6px; opacity: 0;
  transition: opacity 0.4s; pointer-events: none;
  z-index: 100; max-width: 300px; text-align: center;
}
#notice.show { opacity: 1; }
#achievePopup {
  position: fixed; bottom: 20px; right: 10px;
  background: linear-gradient(135deg, #b8860b, #8b6914);
  border: 2px solid #ffec8b;
  padding: 10px 16px; border-radius: 8px;
  opacity: 0; transition: opacity 0.5s;
  pointer-events: none; z-index: 100;
  max-width: 250px;
}
#achievePopup.show { opacity: 1; }
#tabs { display: flex; gap: 3px; padding: 8px 8px 0; }
.tab {
  flex: 1; text-align: center; padding: 7px 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 6px 6px 0 0;
  cursor: pointer; font-weight: bold; font-size: 0.85em;
}
.tab.active { background: rgba(255,255,255,0.2); border-bottom: 2px solid #ffec8b; color: #ffec8b; }
#tabBody { flex: 1; overflow-y: auto; padding: 8px; }
.tabContent { display: none; }
.tabContent.active { display: block; }
.upgrade, .building {
  background: rgba(255,255,255,0.07);
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 8px; padding: 7px 9px;
  margin-bottom: 5px; cursor: pointer;
  display: flex; justify-content: space-between;
  align-items: center; transition: background 0.12s, border-color 0.12s;
}
.building:hover, .upgrade:hover { background: rgba(255,255,255,0.18); border-color: #ffec8b; }
.disabled { opacity: 0.38; cursor: not-allowed; }
.disabled:hover { background: rgba(255,255,255,0.07) !important; border-color: rgba(255,255,255,0.12) !important; }
.name { font-weight: bold; font-size: 0.92em; }
.desc { font-size: 0.75em; opacity: 0.78; margin-top: 1px; }
.price { font-size: 0.85em; white-space: nowrap; margin-left: 8px; text-align: right; }
.owned {
  background: #4a2e10; border-radius: 50%;
  min-width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8em; margin-left: 6px; font-weight: bold;
}
.secLabel {
  font-size: 0.78em; color: #ffec8b; margin: 8px 0 3px;
  text-transform: uppercase; letter-spacing: 1px;
  border-bottom: 1px solid rgba(255,236,139,0.3); padding-bottom: 2px;
}
.achieve {
  background: rgba(184,134,11,0.15);
  border: 2px solid rgba(184,134,11,0.4);
  border-radius: 8px; padding: 7px 10px; margin-bottom: 5px;
  display: flex; align-items: center; gap: 10px;
}
.achieve.locked { opacity: 0.35; filter: grayscale(0.8); }
.achieve-icon { font-size: 1.8em; }
.achieve-name { font-weight: bold; font-size: 0.88em; }
.achieve-desc { font-size: 0.75em; opacity: 0.8; }
.stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.85em; }
.stat-val { color: #ffec8b; font-weight: bold; }
#multiplierBar { font-size: 0.8em; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 5px 8px; margin: 5px 0; }
</style>
</head>

<div id="ticker"><span id="tickerInner">💩 Welcome to Tom Pearl: Poop Clicker! Click Tom to begin your journey... 💩</span></div>

  </div>

    <button class="ctrl" onclick="resetGame()">🔄 Reset</button>

/* ============================================================
   HELPERS
============================================================ */
function totalBuildings(s) {
  return Object.values(s.buildings).reduce((a,b)=>a+b,0);
}

function formatNumber(num) {
  if (isNaN(num)||!isFinite(num)) return '0';
  if (num < 0) return '-'+formatNumber(-num);
  if (num < 1000) return Math.floor(num).toString();
  const units=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td'];
  let i=0;
  while (num>=1000 && i<units.length-1){ num/=1000; i++; }
  return num.toFixed(2)+units[i];
}

function buildingCost(b) {
  return Math.ceil(b.baseCost * Math.pow(1.15, state.buildings[b.id]));
}

function buildingCps(b) {
  return b.baseCps * state.buildings[b.id] * (state.buildingMultipliers[b.id]||1);
}

function calcCps() {
  let t=0;
  buildingData.forEach(b=>{ t+=buildingCps(b); });
  return t * state.globalMultiplier * state.prestigeMultiplier;
}

function calcClickValue() {
  const cps = calcCps();
  return (state.clickValue + cps * state.clickFromCpsRate) * state.clickMultiplier * state.globalMultiplier * state.prestigeMultiplier;
}

function prestigeGain() {
  // each prestige gives +10% bonus multiplier
  const gain = Math.floor(state.totalPoopsEarned / 1e12);
  return gain > 0 ? 1 + gain * 0.1 : null;
}

/* ============================================================
   SAVE / LOAD
============================================================ */
const SAVE_KEY = 'tomPearlPoopClickerV2';

function saveGame(silent) {
  state.lastSave = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  if (!silent) showNotice('💾 Game Saved!');
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  try {
    const loaded = JSON.parse(raw);
    state = Object.assign(state, loaded);
    buildingData.forEach(b => {
      if (!(b.id in state.buildings)) state.buildings[b.id]=0;
      if (!(b.id in state.buildingMultipliers)) state.buildingMultipliers[b.id]=1;
    });
    if (!state.prestigeMultiplier) state.prestigeMultiplier=1;
    if (!state.goldenPoopsClicked) state.goldenPoopsClicked=0;
    // offline earnings
    const secs = Math.max(0,(Date.now()-(state.lastSave||Date.now()))/1000);
    if (secs>5) {
      const earned = calcCps() * Math.min(secs, 86400*7);
      if (earned>0) {
        state.poops += earned;
        state.totalPoopsEarned += earned;
        setTimeout(()=>showNotice('👋 Welcome back! Tom made '+formatNumber(earned)+' poops while you slept!',4000),500);
      }
    }
  } catch(e){ console.error(e); }
}

function exportSave() {
  state.lastSave=Date.now();
  const data=btoa(JSON.stringify(state));
  try {
    navigator.clipboard.writeText(data).then(()=>showNotice('📋 Save copied!'));
  } catch(e){
    const ta=document.createElement('textarea');
    ta.value=data; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showNotice('📋 Save copied!');
  }
}

function importSave() {
  const data=prompt('Paste your save string:');
  if (!data) return;
  try {
    const loaded=JSON.parse(atob(data.trim()));
    state=Object.assign(state,loaded);
    buildingData.forEach(b=>{
      if(!(b.id in state.buildings)) state.buildings[b.id]=0;
      if(!(b.id in state.buildingMultipliers)) state.buildingMultipliers[b.id]=1;
    });
    saveGame(true); renderAll(); showNotice('✅ Save imported!');
  } catch(e){ alert('Invalid save string.'); }
}

function resetGame() {
  if (!confirm('Reset ALL progress? This cannot be undone.')) return;
  localStorage.removeItem(SAVE_KEY); location.reload();
}

function doPrestige() {
  const gain = prestigeGain();
  if (!gain) return;
  if (!confirm('Prestige? You will lose all poops and producers, but gain a permanent x'+gain.toFixed(2)+' multiplier!')) return;
  // reset most state
  state.poops=0;
  state.totalPoopsEarned=0;
  state.totalClicks=0;
  state.clickValue=1;
  state.clickMultiplier=1;
  state.clickFromCpsRate=0;
  state.globalMultiplier=1;
  buildingData.forEach(b=>{ state.buildings[b.id]=0; state.buildingMultipliers[b.id]=1; });
  state.upgradesBought={};
  state.prestigeCount=(state.prestigeCount||0)+1;
  state.prestigeMultiplier=(state.prestigeMultiplier||1)*gain;
  saveGame(true); renderAll();
  showNotice('⚗️ Prestige! You now have a x'+state.prestigeMultiplier.toFixed(2)+' permanent bonus!',4000);
}

function clickTom(e) {
  const amount=calcClickValue();
  state.poops+=amount;
  state.totalPoopsEarned+=amount;
  state.totalClicks++;

  const float=document.createElement('div');
  float.className='floatup';
  float.textContent='+'+formatNumber(amount);
  const rect=document.getElementById('tomWrap').getBoundingClientRect();
  float.style.left=(e.clientX-rect.left)+'px';
  float.style.top=(e.clientY-rect.top)+'px';
  document.getElementById('tomWrap').appendChild(float);
  setTimeout(()=>float.remove(),1000);
  updateDisplay();
}

function buyBuilding(b) {
  const cost=buildingCost(b);
  if (state.poops<cost) return;
  state.poops-=cost;
  state.buildings[b.id]++;
  renderBuildings(); renderUpgrades(); updateDisplay();
}

function buyUpgrade(u) {
  if (state.upgradesBought[u.id]) return;
  if (state.poops<u.cost) return;
  if (u.req && state.buildings[u.req.id]<u.req.amt) return;
  state.poops-=u.cost;
  state.upgradesBought[u.id]=true;
  switch(u.type) {
    case 'click':        state.clickValue+=u.value; break;
    case 'clickMult':    state.clickMultiplier*=u.value; break;
    case 'clickFromCps': state.clickFromCpsRate+=u.value; break;
    case 'building':     state.buildingMultipliers[u.target]=(state.buildingMultipliers[u.target]||1)*u.mult; break;
    case 'globalMult':   state.globalMultiplier*=u.mult; break;
  }
  renderBuildings(); renderUpgrades(); updateDisplay();
}

  goldenPhase = 1;
  goldenClickCount = 0;

  el.style.left = (Math.random() * (window.innerWidth - 80)) + 'px';
  el.style.top = (Math.random() * (window.innerHeight - 80)) + 'px';
  el.style.fontSize = '3em';
  el.style.animation = 'bobble 0.4s ease-in-out infinite alternate';
  el.style.transition = '';
  el.textContent = '✨💩✨';
  el.style.display = 'block';
  goldenActive = true;

  // Phase 2: starts drifting slowly after 3s
  setTimeout(() => {
    if (!goldenActive) return;
    goldenPhase = 2;
    showNotice("👀 A GOLDEN POOP APPEARED!! CLICK IT!!", 3000);
    el.style.fontSize = '3.5em';
    el.textContent = '🌟💩🌟';
    goldenMoveInterval = setInterval(() => {
      if (!goldenActive || goldenPhase < 2) return;
      const speed = goldenPhase === 2 ? 600 : goldenPhase === 3 ? 80 : 40;
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      el.style.transition = 'left '+(speed/1000)+'s, top '+(speed/1000)+'s';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }, goldenPhase === 2 ? 800 : 150);
  }, 3000);

  // Phase 3: PANICKING after 8s
  setTimeout(() => {
    if (!goldenActive) return;
    goldenPhase = 3;
    clearInterval(goldenMoveInterval);
    el.style.animation = 'spinCrazy 0.2s linear infinite, flashColors 0.3s linear infinite';
    el.style.fontSize = '5em';
    el.textContent = '💀💩💀';
    shakeScreen(2000);
    showNotice("😱😱 IT'S PANICKING!! CATCH IT!! CATCH IT NOW!!", 3000);
    goldenMoveInterval = setInterval(() => {
      if (!goldenActive) return;
      el.style.transition = 'left 0.08s, top 0.08s';
      el.style.left = (Math.random() * (window.innerWidth - 120)) + 'px';
      el.style.top = (Math.random() * (window.innerHeight - 120)) + 'px';
    }, 100);
  }, 8000);

  // Phase 4: BERSERK after 13s - spawns fakes
  setTimeout(() => {
    if (!goldenActive) return;
    goldenPhase = 4;
    el.style.fontSize = '2em';
    el.textContent = '💩';
    showNotice("💀💀 IT SPAWNED FAKES!! FIND THE REAL ONE!!!!", 4000);
    shakeScreen(5000);
    // spawn fake clones
    for (let i = 0; i < 8; i++) {
      const fake = document.createElement('div');
      fake.textContent = '💩';
      fake.style.cssText = 'position:fixed;font-size:2em;z-index:9998;cursor:pointer;animation:spinCrazy 0.3s linear infinite,flashColors 0.4s linear infinite;';
      fake.style.left = (Math.random()*(window.innerWidth-80))+'px';
      fake.style.top = (Math.random()*(window.innerHeight-80))+'px';
      fake.addEventListener('click', () => {
        nukeScreen('rgba(255,0,0,0.5)');
        shakeScreen(500);
        showNotice("❌ FAKE!! That was a decoy!! Find the real golden poop!!", 2000);
        fake.remove();
      });
      document.body.appendChild(fake);
      goldenClones.push(fake);
    }
    goldenMoveInterval && clearInterval(goldenMoveInterval);
    goldenMoveInterval = setInterval(() => {
      if (!goldenActive) return;
      el.style.transition = 'none';
      el.style.left = (Math.random()*(window.innerWidth-80))+'px';
      el.style.top = (Math.random()*(window.innerHeight-80))+'px';
    }, 60);
  }, 13000);

  // Gone after 25s
  goldenTimeout = setTimeout(() => {
    if (!goldenActive) return;
    killGoldenPoop();
    nukeScreen('rgba(0,0,0,0.7)');
    shakeScreen(1000);
    showNotice("💨💨 THE GOLDEN POOP ESCAPED AND TOOK 10% OF YOUR POOPS WITH IT!! 😭", 4000);
    state.poops = Math.max(0, state.poops * 0.9);
    scheduleGoldenPoop();
  }, 25000);
}

function killGoldenPoop() {
  clearTimeout(goldenTimeout);
  clearInterval(goldenMoveInterval);
  goldenClones.forEach(c => c.remove());
  goldenClones = [];
  const el = document.getElementById('goldenPoop');
  el.style.display = 'none';
  el.style.transition = '';
  goldenActive = false;
  goldenPhase = 0;
}

document.getElementById('goldenPoop').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!goldenActive) return;

  // In berserk phase need 5 clicks
  if (goldenPhase >= 3) {
    goldenClickCount++;
    const needed = goldenPhase >= 4 ? 5 : 3;
    shakeScreen(200);
    showNotice(["1...", "2...", "3...", "4...", "ALMOST!!!"][Math.min(goldenClickCount-1, 4)], 800);
    if (goldenClickCount < needed) return;
  }

  killGoldenPoop();
  state.goldenPoopsClicked++;

  // Stack effects if clicked in berserk phase
  const numEffects = goldenPhase >= 4 ? 3 : goldenPhase >= 3 ? 2 : 1;
  const shuffled = [...goldenEffects].sort(() => Math.random()-0.5);
  for (let i = 0; i < numEffects; i++) {
    setTimeout(() => shuffled[i].apply(), i * 1500);
  }

  if (numEffects > 1) showNotice("🔥🔥🔥 YOU CAUGHT IT IN BERSERK PHASE!! " + numEffects + " EFFECTS AT ONCE!!!!", 6000);

  setTimeout(() => { updateDisplay(); renderBuildings(); renderUpgrades(); }, 100);
  scheduleGoldenPoop();
});

/* ============================================================
   ACHIEVEMENTS
============================================================ */
function checkAchievements() {
  achievementData.forEach(a=>{
    if (!state.achievementsUnlocked[a.id] && a.req(state)) {
      state.achievementsUnlocked[a.id]=true;
      showAchievementPopup(a);
    }
  });
}

function showAchievementPopup(a) {
  const el=document.getElementById('achievePopup');
  el.innerHTML=`<b>${a.icon} Achievement Unlocked!</b><br>${a.name}<br><small>${a.desc}</small>`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),4000);
}

/* ============================================================
   RENDERING
============================================================ */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.querySelectorAll('.tabContent').forEach(c=>c.classList.toggle('active',c.id===tab));
  if (tab==='achievements') renderAchievements();
  if (tab==='statsTab') renderStats();
}

function renderBuildings() {
  const container=document.getElementById('buildings');
  container.innerHTML='<div class="secLabel">💩 Poop Producers</div>';
  buildingData.forEach(b=>{
    const cost=buildingCost(b);
    const owned=state.buildings[b.id];
    const cps=buildingCps(b)*state.globalMultiplier*state.prestigeMultiplier;
    const canAfford=state.poops>=cost;
    const div=document.createElement('div');
    div.className='building'+(canAfford?'':' disabled');
    div.onclick=()=>buyBuilding(b);
    div.innerHTML=`
      <div style="flex:1">
        <div class="name">${b.emoji} ${b.name}</div>
        <div class="desc">${b.desc}</div>
        <div class="desc" style="color:#aef">Producing: ${formatNumber(cps)}/s total</div>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <div class="price">${formatNumber(cost)}<br><small>poops</small></div>
        <div class="owned">${owned}</div>
      </div>`;
    container.appendChild(div);
  });
}

function renderUpgrades() {
  const container=document.getElementById('upgrades');
  container.innerHTML='';
  let shown=0;
  // group by category
  const groups=[
    {label:'👆 Click Upgrades', ids:upgradeData.filter(u=>['click','clickMult','clickFromCps'].includes(u.type))},
    {label:'🏗️ Producer Upgrades', ids:upgradeData.filter(u=>u.type==='building')},
    {label:'🌍 Global Multipliers', ids:upgradeData.filter(u=>u.type==='globalMult')},
  ];
  groups.forEach(g=>{
    const available=g.ids.filter(u=>{
      if (state.upgradesBought[u.id]) return false;
      if (u.req && state.buildings[u.req.id]<u.req.amt) return false;
      return true;
    });
    if (!available.length) return;
    const lbl=document.createElement('div');
    lbl.className='secLabel';
    lbl.textContent=g.label;
    container.appendChild(lbl);
    available.forEach(u=>{
      shown++;
      const div=document.createElement('div');
      div.className='upgrade'+(state.poops>=u.cost?'':' disabled');
      div.onclick=()=>buyUpgrade(u);
      div.innerHTML=`
        <div>
          <div class="name">${u.name}</div>
          <div class="desc">${u.desc}</div>
        </div>
        <div class="price">${formatNumber(u.cost)}<br><small>poops</small></div>`;
      container.appendChild(div);
    });
  });
  if (!shown) container.innerHTML='<div class="desc" style="padding:12px;text-align:center">No upgrades available yet — keep collecting poop! 💩</div>';
}

function renderAchievements() {
  const container=document.getElementById('achievements');
  const unlocked=Object.keys(state.achievementsUnlocked).length;
  container.innerHTML=`<div class="secLabel">🏆 Achievements (${unlocked}/${achievementData.length})</div>`;
  achievementData.forEach(a=>{
    const got=!!state.achievementsUnlocked[a.id];
    const div=document.createElement('div');
    div.className='achieve'+(got?'':' locked');
    div.innerHTML=`
      <div class="achieve-icon">${a.icon}</div>
      <div>
        <div class="achieve-name">${got?a.name:'???'}</div>
        <div class="achieve-desc">${got?a.desc:'Keep playing to unlock...'}</div>
      </div>`;
    container.appendChild(div);
  });
}

function renderStats() {
  const container=document.getElementById('statsTab');
  const rows=[
    ['Total Poops Collected', formatNumber(state.totalPoopsEarned)],
    ['Current Poops', formatNumber(state.poops)],
    ['Poops Per Second', formatNumber(calcCps())],
    ['Poops Per Click', formatNumber(calcClickValue())],
    ['Total Clicks', formatNumber(state.totalClicks)],
    ['Total Producers', formatNumber(totalBuildings(state))],
    ['Upgrades Bought', Object.keys(state.upgradesBought).length+' / '+upgradeData.length],
    ['Achievements', Object.keys(state.achievementsUnlocked).length+' / '+achievementData.length],
    ['Golden Poops Clicked', state.goldenPoopsClicked],
    ['Global Multiplier', 'x'+state.globalMultiplier.toFixed(2)],
    ['Prestige Multiplier', 'x'+state.prestigeMultiplier.toFixed(2)],
    ['Prestige Count', state.prestigeCount],
    ['Session Time', formatTime(Date.now()-sessionStart)],
  ];
  container.innerHTML='<div class="secLabel">📊 Statistics</div>'+
    rows.map(([l,v])=>`<div class="stat-row"><span>${l}</span><span class="stat-val">${v}</span></div>`).join('');
}

let sessionStart=Date.now();
function formatTime(ms) {
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  return h?`${h}h ${m%60}m`:`${m}m ${s%60}s`;
}

function updateTomImage() {
  let current=tomMilestones[0];
  for (const m of tomMilestones) {
    if (state.totalPoopsEarned>=m.threshold) current=m;
  }
  const imgEl=document.getElementById('tomImg');
  if (imgEl.dataset.currentImg!==current.img) {
    imgEl.dataset.currentImg=current.img;
    imgEl.src=current.img;
    imgEl.onerror=()=>{ imgEl.style.background='#3a2010'; };
    document.getElementById('milestoneLabel').textContent=current.label;
  }
}

function updateDisplay() {
  updateTomImage();
  document.getElementById('count').textContent=formatNumber(state.poops)+' 💩';
  document.getElementById('perSec').textContent=formatNumber(calcCps())+' poops/sec';
  document.getElementById('clickVal').textContent='+'+formatNumber(calcClickValue())+' per click';
  document.getElementById('globalMult').textContent='x'+(state.globalMultiplier).toFixed(2);
  document.getElementById('prestigeBonus').textContent='x'+(state.prestigeMultiplier).toFixed(2);
  document.getElementById('stats').innerHTML=
    'Total: '+formatNumber(state.totalPoopsEarned)+' 💩<br>'+
    'Clicks: '+formatNumber(state.totalClicks)+' | Prestige: '+state.prestigeCount;

  // prestige button
  const pg=prestigeGain();
  const pbtn=document.getElementById('prestigeBtn');
  if (pg && state.totalPoopsEarned>=1e12) {
    pbtn.style.display='inline-block';
    document.getElementById('prestigeMult').textContent=pg.toFixed(2);
  } else {
    pbtn.style.display='none';
    document.getElementById('prestigeCount').textContent=state.prestigeCount>0?'Prestiges: '+state.prestigeCount+' | Bonus: x'+state.prestigeMultiplier.toFixed(2):'Reach 1 trillion poops to prestige!';
  }

  // building affordability
  document.querySelectorAll('.building').forEach((el,i)=>{
    const b=buildingData[i];
    if (!b) return;
    el.classList.toggle('disabled',state.poops<buildingCost(b));
  });
  document.querySelectorAll('.upgrade').forEach(el=>{
    // re-check via onclick reference not available; handled in renderUpgrades
  });
}

function updateTicker() {
  const line=newsLines[Math.floor(Math.random()*newsLines.length)];
  document.getElementById('tickerInner').textContent='💩 '+line+' 💩';
}

function renderAll() {
  renderBuildings();
  renderUpgrades();
  updateDisplay();
}

/* ============================================================
   INIT & LOOPS
============================================================ */
document.getElementById('tomImg').addEventListener('click', clickTom);

loadGame();
renderAll();
scheduleGoldenPoop();
updateTicker();
setInterval(updateTicker, 42000);

// main tick: 10/sec
setInterval(()=>{
  const cps=calcCps()/10;
  state.poops+=cps;
  state.totalPoopsEarned+=cps;
  updateDisplay();
  checkAchievements();
}, 100);

// re-render panels: 1/sec
setInterval(()=>{
  renderBuildings();
  renderUpgrades();
  const active=document.querySelector('.tab.active');
  if (active && active.dataset.tab==='statsTab') renderStats();
}, 1000);

// autosave: every 30 sec
setInterval(()=>saveGame(true), 30000);

window.addEventListener('beforeunload', ()=>saveGame(true));
</script>
</body>
</html>
